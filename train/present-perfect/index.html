"present-perfect\",\"level\":\"A2\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"She ___ in Moscow for ten years.\",\"options\":[\"lives\",\"has lived\",\"is living\",\"lived\"],\"answers\":[\"has lived\"],\"explanation\":\"For ten years: действие началось в прошлом и продолжается сейчас. Для этого нужен Present Perfect.\",\"mistakes\":[{\"wrong\":\"lives\",\"hint\":\"С for / since нужен Present Perfect, а не Present Simple.\"}]},{\"id\":\"pp-008\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"I haven't seen him ___ Monday.\",\"options\":[\"for\",\"since\",\"ago\",\"during\"],\"answers\":[\"since\"],\"explanation\":\"Since используем с точкой отсчёта (с понедельника, с 2020 года, с утра). For используем с периодом (пять лет, две недели).\",\"mistakes\":[{\"wrong\":\"for\",\"hint\":\"Monday — это момент, а не период. Для момента нужен since.\"}]},{\"id\":\"pp-009\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"They have lived here ___ five years.\",\"options\":[\"for\",\"since\",\"from\",\"ago\"],\"answers\":[\"for\"],\"explanation\":\"Five years — это период, поэтому for. Since используем с моментом начала.\",\"mistakes\":[{\"wrong\":\"since\",\"hint\":\"Five years — период, для него нужен for.\"}]},{\"id\":\"pp-010\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"Has she ___ her homework?\",\"options\":[\"done\",\"did\",\"do\",\"does\"],\"answers\":[\"done\"],\"explanation\":\"После has нужна третья форма глагола: do → did → done.\",\"mistakes\":[{\"wrong\":\"did\",\"hint\":\"После has / have нужна третья форма: done.\"}]},{\"id\":\"pp-011\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"My brother has never ___ sushi.\",\"options\":[\"tried\",\"try\",\"trying\",\"tries\"],\"answers\":[\"tried\"],\"explanation\":\"После has нужна третья форма. Try — согласная + y, поэтому y меняем на -ied: tried.\"},{\"id\":\"pp-012\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"I ___ my keys. I can't find them.\",\"options\":[\"have lost\",\"has lost\",\"have losed\",\"lose\"],\"answers\":[\"have lost\"],\"explanation\":\"Важен результат сейчас: ключей нет. Это типичный случай для Present Perfect. Lose → lost → lost.\",\"mistakes\":[{\"wrong\":\"have losed\",\"hint\":\"Lose — неправильный глагол: lose → lost → lost.\"}]},{\"id\":\"pp-013\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"How long ___ you known Anna?\",\"options\":[\"have\",\"do\",\"are\",\"has\"],\"answers\":[\"have\"],\"explanation\":\"How long (как долго) с глаголами состояния (know) требует Present Perfect. С you используем have.\",\"mistakes\":[{\"wrong\":\"do\",\"hint\":\"How long ... known — это Present Perfect, нужен have.\"}]},{\"id\":\"pp-014\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"I ___ to the dentist yesterday.\",\"options\":[\"have been\",\"went\",\"have gone\",\"go\"],\"answers\":[\"went\"],\"explanation\":\"Yesterday — конкретное время в прошлом, поэтому Past Simple. С такими словами Present Perfect не используется.\",\"mistakes\":[{\"wrong\":\"have been\",\"hint\":\"С yesterday нужен Past Simple (went), а не Present Perfect.\"}]},{\"id\":\"pp-015\",\"tense\":\"present-perfect\",\"level\":\"B1\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"Tom ___ to Paris. He is not here now.\",\"options\":[\"has gone\",\"has been\",\"have gone\",\"goes\"],\"answers\":[\"has gone\"],\"explanation\":\"Has gone значит «уехал и ещё там». Has been значит «побывал и вернулся». Tom сейчас не здесь, поэтому has gone.\",\"mistakes\":[{\"wrong\":\"has been\",\"hint\":\"Has been — это «побывал и вернулся». А Tom ещё в Париже.\"}]},{\"id\":\"pp-016\",\"tense\":\"present-perfect\",\"level\":\"B1\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"I ___ to Paris twice. I loved it.\",\"options\":[\"have been\",\"have gone\",\"has been\",\"was\"],\"answers\":[\"have been\"],\"explanation\":\"Я побывал и вернулся, поэтому have been. Have gone значило бы, что я до сих пор там.\",\"mistakes\":[{\"wrong\":\"have gone\",\"hint\":\"Have gone — «уехал и ещё не вернулся», а рассказчик уже здесь.\"}]},{\"id\":\"pp-017\",\"tense\":\"present-perfect\",\"level\":\"B1\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"We ___ lunch yet.\",\"options\":[\"haven't had\",\"hasn't had\",\"haven't has\",\"didn't had\"],\"answers\":[\"haven't had\"],\"explanation\":\"Yet в отрицании говорит о Present Perfect. С we: haven't + V3. Have → had → had.\",\"mistakes\":[{\"wrong\":\"hasn't had\",\"hint\":\"С we нужно haven't.\"}]},{\"id\":\"pp-018\",\"tense\":\"present-perfect\",\"level\":\"B1\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"She ___ three cups of coffee today.\",\"options\":[\"has drunk\",\"have drunk\",\"has drank\",\"drinks\"],\"answers\":[\"has drunk\"],\"explanation\":\"Today ещё не закончилось, значит Present Perfect. С she нужно has. Drink → drank → drunk.\",\"mistakes\":[{\"wrong\":\"has drank\",\"hint\":\"После has нужна третья форма: drunk.\"}]},{\"id\":\"pp-019\",\"tense\":\"present-perfect\",\"level\":\"B2\",\"type\":\"choice\",\"instruction\":\"Выберите правильный вариант.\",\"text\":\"This is the best film I ___.\",\"options\":[\"have ever seen\",\"am ever seeing\",\"have ever saw\",\"would ever see\"],\"answers\":[\"have ever seen\"],\"explanation\":\"После превосходной степени (the best, the worst, the most...) для опыта использ ,\"level\":\"A2\",\"type\":\"input\",\"instruction\":\"Впишите отрицательную форму (два-три слова).\",\"text\":\"I ___ (not / see) her today.\",\"answers\":[\"haven't seen\",\"have not seen\"],\"explanation\":\"С I отрицание: haven't (have not) + V3. See → saw → seen.\",\"mistakes\":[{\"wrong\":\"haven't saw\",\"hint\":\"После haven't нужна третья форма: seen.\"}]},{\"id\":\"pp-026\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"input\",\"instruction\":\"Впишите have или has.\",\"text\":\"___ she ever been to Spain?\",\"answers\":[\"Has\"],\"explanation\":\"В вопросе вспомогательный глагол идёт первым. С she используем has.\",\"mistakes\":[{\"wrong\":\"Have\",\"hint\":\"С she / he / it нужно has.\"}]},{\"id\":\"pp-027\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"input\",\"instruction\":\"Впишите have / has и глагол (два слова).\",\"text\":\"My sister ___ (study) English for five years.\",\"answers\":[\"has studied\"],\"explanation\":\"Sister = she, поэтому has. Study — согласная + y, поэтому y меняем на -ied: studied.\",\"mistakes\":[{\"wrong\":\"has studyed\",\"hint\":\"После согласной + y пишем -ied: studied.\"}]},{\"id\":\"pp-028\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"input\",\"instruction\":\"Впишите have / has и глагол (два слова).\",\"text\":\"He ___ (write) three letters this week.\",\"answers\":[\"has written\"],\"explanation\":\"This week ещё не закончилась, поэтому Present Perfect. Write → wrote → written.\",\"mistakes\":[{\"wrong\":\"has wrote\",\"hint\":\"После has нужна третья форма: written.\"}]},{\"id\":\"pp-029\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"input\",\"instruction\":\"Впишите третью форму глагола (V3).\",\"text\":\"I have ___ (take) many photos today.\",\"answers\":[\"taken\"],\"explanation\":\"Take → took → taken. После have нужна третья форма.\",\"mistakes\":[{\"wrong\":\"took\",\"hint\":\"После have нужна третья форма: taken.\"}]},{\"id\":\"pp-030\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"input\",\"instruction\":\"Впишите третью форму глагола (V3).\",\"text\":\"They have ___ (buy) a new car.\",\"answers\":[\"bought\"],\"explanation\":\"Buy → bought → bought: вторая и третья формы совпадают.\"},{\"id\":\"pp-031\",\"tense\":\"present-perfect\",\"level\":\"A2\",\"type\":\"input\",\"instruction\":\"Впишите третью форму глагола (V3).\",\"text\":\"We have ___ (be) here since morning.\",\"answers\":[\"been\"],\"explanation\":\"Be → was / were → been. Since morning: действие продолжается до сих пор.\",\"mistakes\":[{\"wrong\":\"was\",\"hint\":\"После have нужна третья форма: been.\"}]},{\"id\":\"pp-032\",\"tense\":\"present-perfect\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите for или since.\",\"text\":\"I have known him ___ 2015.\",\"answers\":[\"since\"],\"explanation\":\"2015 — момент начала, поэтому since.\",\"mistakes\":[{\"wrong\":\"for\",\"hint\":\"For используем с периодом (пять лет), а 2015 — это момент.\"}]},{\"id\":\"pp-033\",\"tense\":\"present-perfect\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите for или since.\",\"text\":\"She has worked here ___ three years.\",\"answers\":[\"for\"],\"explanation\":\"Three years — период, поэтому for.\",\"mistakes\":[{\"wrong\":\"since\",\"hint\":\"Three years — период, нужен for.\"}]},{\"id\":\"pp-034\",\"tense\":\"present-perfect\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите have / has и глагол (два слова).\",\"text\":\"He ___ (lose) his phone. He can't call you.\",\"answers\":[\"has lost\"],\"explanation\":\"Важен результат сейчас: телефона нет, позвонить нельзя. Lose → lost → lost.\"},{\"id\":\"pp-035\",\"tense\":\"present-perfect\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите отрицательную форму (два-три слова).\",\"text\":\"I ___ (not / finish) the book yet.\",\"answers\":[\"haven't finished\",\"have not finished\"],\"explanation\":\"Yet в отрицании: haven't (have not) + V3.\"},{\"id\":\"pp-036\",\"te
