ting\"],\"explanation\":\"Continuous описывает постепенные изменения. Get — краткий слог, t удваиваем: getting.\",\"mistakes\":[{\"wrong\":\"is geting\",\"hint\":\"Согласную t нужно удвоить: getting.\"}]},{\"id\":\"pc-035\",\"tense\":\"present-continuous\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"I ___ (stay) with my aunt this week.\",\"answers\":[\"am staying\"],\"explanation\":\"This week — временная ситуация, поэтому Continuous: am staying.\"},{\"id\":\"pc-036\",\"tense\":\"present-continuous\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите отрицательную форму (два-три слова).\",\"text\":\"We ___ (not / go) out tonight. We're tired.\",\"answers\":[\"aren't going\",\"are not going\"],\"explanation\":\"С we отрицание: aren't (are not) + глагол с -ing. Это решение на ближайшее будущее.\"},{\"id\":\"pc-037\",\"tense\":\"present-continuous\",\"level\":\"B2\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"The company ___ (grow) fast these days.\",\"answers\":[\"is growing\"],\"explanation\":\"These days указывает на текущую тенденцию, а Continuous как раз описывает развитие. Company = it, поэтому is.\"},{\"id\":\"pc-038\",\"tense\":\"present-continuous\",\"level\":\"B2\",\"type\":\"input\",\"instruction\":\"Впишите глагол с -ing (одно слово).\",\"text\":\"He is always ___ (complain) about the weather.\",\"answers\":[\"complaining\"],\"explanation\":\"Always с Continuous передаёт раздражение: он вечно жалуется. Нужна форма с -ing.\"},{\"id\":\"pc-039\",\"tense\":\"present-continuous\",\"level\":\"A1\",\"type\":\"build\",\"instruction\":\"Соберите предложение на английском. Одно слово лишнее.\",\"text\":\"Я читаю книгу.\",\"options\":[\"I\",\"am\",\"reading\",\"a\",\"book\",\"read\"],\"answers\":[\"I am reading a book\"],\"explanation\":\"Present Continuous: am + глагол с -ing. Слово read лишнее.\"},{\"id\":\"pc-040\",\"tense\"
