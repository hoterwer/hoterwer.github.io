forgetting\"],\"explanation\":\"Always с Continuous показывает раздражающую привычку: She is always forgetting her umbrella.\",\"mistakes\":[{\"wrong\":\"forget\",\"hint\":\"После is нужна форма с -ing.\"}]},{\"id\":\"pc-021\",\"tense\":\"present-continuous\",\"level\":\"A1\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"I ___ (write) an email.\",\"answers\":[\"am writing\"],\"explanation\":\"С I используем am. Глагол write оканчивается на -e, его убираем: writing.\",\"mistakes\":[{\"wrong\":\"am writeing\",\"hint\":\"Конечное -e убираем: writing.\"}]},{\"id\":\"pc-022\",\"tense\":\"present-continuous\",\"level\":\"A1\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"He ___ (run) in the park now.\",\"answers\":[\"is running\"],\"explanation\":\"Run — краткий слог с согласной на конце, поэтому n удваиваем: running.\",\"mistakes\":[{\"wrong\":\"is runing\",\"hint\":\"Согласную n нужно удвоить: running.\"}]},{\"id\":\"pc-023\",\"tense\":\"present-continuous\",\"level\":\"A1\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"She ___ (make) breakfast.\",\"answers\":[\"is making\"],\"explanation\":\"С she используем is. У глагола make убираем -e: making.\",\"mistakes\":[{\"wrong\":\"is makeing\",\"hint\":\"Конечное -e убираем: making.\"}]},{\"id\":\"pc-024\",\"tense\":\"present-continuous\",\"level\":\"A1\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"We ___ (sit) in the café.\",\"answers\":[\"are sitting\"],\"explanation\":\"С we используем are. Sit — краткий слог, поэтому t удваиваем: sitting.\",\"mistakes\":[{\"wrong\":\"are siting\",\"hint\":\"Согласную t нужно удвоить: sitting.\"}]},{\"id\":\"pc-025\",\"tense\":\"present-continuous\",\"level\":\"A2\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"The c :\"present-continuous\",\"level\":\"A2\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"The students ___ (swim) in the pool.\",\"answers\":[\"are swimming\"],\"explanation\":\"Students = they, поэтому are. Swim — краткий слог, m удваиваем: swimming.\",\"mistakes\":[{\"wrong\":\"are swiming\",\"hint\":\"Согласную m нужно удвоить: swimming.\"}]},{\"id\":\"pc-032\",\"tense\":\"present-continuous\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"I ___ (go) to the dentist tomorrow morning. I have an appointment.\",\"answers\":[\"am going\"],\"explanation\":\"Запланированное действие в ближайшем будущем: запись к врачу уже есть. Используем Present Continuous.\"},{\"id\":\"pc-033\",\"tense\":\"present-continuous\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"He ___ (play) the guitar. Listen!\",\"answers\":[\"is playing\"],\"explanation\":\"Listen! показывает, что действие происходит сейчас. После y перед -ing ничего не меняем: playing.\",\"mistakes\":[{\"wrong\":\"is plaing\",\"hint\":\"Букву y сохраняем: playing.\"}]},{\"id\":\"pc-034\",\"tense\":\"present-continuous\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"Her English ___ (get) better and better.\",\"answers\":[\"is getting\"],\"explanation\":\"Continuous описывает постепенные изменения. Get — краткий слог, t удваиваем: getting.\",\"mistakes\":[{\"wrong\":\"is geting\",\"hint\":\"Согласную t нужно удвоить: getting.\"}]},{\"id\":\"pc-035\",\"tense\":\"present-continuous\",\"level\":\"B1\",\"type\":\"input\",\"instruction\":\"Впишите am / is / are и глагол с -ing (два слова).\",\"text\":\"I ___ (stay) with my aunt this week.\",\"answers\":[\"am staying\"],\"explanation\":\"This week — временная ситуация, поэтому Continuous: am staying.\"},{\"id\":\"pc-
